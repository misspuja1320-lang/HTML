<html>
    <head>
        <title>Form</title>
    </head>
    <body>
        <h1><b>Application Form</b></h1>
        <form align="center">
            <table>
                <tr><td>First Name</td>
                    <td><input type="text"name="firstname"></td></tr>
                    <tr><td>Last Name</td>
                        <td><input type="text"name="lastname"></td></tr>
                        <tr><td>E-mail Id</td>
                            <td><input type="text"name="emailid"></td></tr>
                            <tr><td>Country:</td>
                                <td><select>
                                    <option>select</option>
                                    <option>India</option>
                                    <option>Pakisthan</option>
                                    <option>USA</option>
                                    <option>South Korea</option>
                                </select>
                            </td></tr>
                            <tr><td>Gender:</td>
                                <td><input type="ratio"name="gender">Male
                                    <input type="ratio"name="gender">Female
                                </td></tr>
                                <tr><td>Language Known:</td>
                                <td><input type="checkbox"name="Language">Bengali
                                    <input type="checkbox"name="Language">English
                                    <input type="checkbox"name="Language">Hindi
                                    <input type="checkbox"name="Language">other
                                    </td></tr>
                                    <tr><td>Description:</td>
                                    <td>
                                        <textarea name="message"rows="5"cols="30"placeholder="Write queary"></textarea>
                                    </td></tr>
                                    <tr align="center">   
                                        <td><input type="submit"name="submit"></td>
                                        <td><input type="reset"name="reset"></td>
                                    </tr>
                                    </table>
                                    </form>
                                    </body>
                                    </html>
