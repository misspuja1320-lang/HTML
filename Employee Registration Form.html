<html>
<head>
    <title> Registration Form </title>
</head>
<body>
   <h1><b><font size="3"color="red">Employee Registration Form</font></b></h1>
    <form>
        <table>
            <tr>
                <td></td>
                <td><input type="ratio"name="initial checked">Mr.
                    <input type="ratio"name="initial checked">Mrs.
                    <input type="ratio"name="initial checked">Miss
                </td></tr>
                <tr><td>First Name</td>
                    <td><input type="text"name="in"placeholder="firstname"></td></tr>
                    <tr><td>Last Name</td>
                        <td><input type="text"name="in"placeholder="lastname"></td></tr>
                        <tr><td>Mail Address 1</td>
                            <td><input type="text"name="add1"></td></tr>
                            <tr><td>Mail Address 2</td>
                                <td><input type="text"name="add2"></td></tr>
                                <tr><td>City</td>
                                <td><input type="text"name="city"></td></tr>
                                <tr><td>State</td>
                                <td>
                                    <select name="State">
                                        <option value="Gujrat">Gujrat
                                        <option value="Maharastra">Maharastra
                                        <opyion value="Delhi">Delhi
                                        <option value="Mumbai">Mumbai
                                    </select>
                                </td></tr>
                                <tr><td>Zip</td>
                                    <td><input type="text"name="zip"></td></tr>
                                    <tr><td>Upload Photo</td>
                                        <td><input type="text"name="photo"></td></tr>
                                        <tr><td>E-mail</td>
                                            <td><input type="text"name="email"size="30"></td></tr>
                                            <tr><td>Mobile</td>
                                                <td><input type="text"name="Mobile"placeholder="+91"></td></tr>
                                                <tr><td>Language Known</td>
                                                <td><input type="checkbox"name="LK"value="Gujrati checked">Gujrati</td></tr>
                                                <tr>
                                                    <td></td>
                                                <td><input type="checkbox"name="LK"value="Hindi checked">Hindi</td></tr>  
                                                <tr>
                                                    <td></td>
                                                    <td><input type="checkbox"name="LK"value="English checked">English</td></tr>
                                                    <tr>
                                                        <td></td>
                                                        <td><input type="checkbox"name="LK"value="Marathi checked">Marathi</td></tr>
                                                        <tr>
                                                            <td>Additional Information</td>
                                                            <td><textarea name="add" rows="3" cols="20" placeholder="optional"wrap></textarea></td>
                                                        </tr>
                                                        <tr>
                                                            <td></td>
                                                            <td><input type="submit" value="submit"></td>
                                                            <td><input type="reset" value="reset"></td>
                                                        </tr>
                                                        </table>
                                                        </form>
                                                        </body>
                                                        </html>
