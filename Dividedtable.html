
<html>
<head>
    <title>Two-Part Table</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #e0e0e0;
        }
        .section-header {
            background-color: #c0c0c0;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1 style="text-align:center;"><b><i>Two-Part Table</i></b></h1>

<table>
    <tr class="section-header">
        <td colspan="3">Student Information</td>
    </tr>
    <tr>
        <th>Name</th>
        <th>Roll No</th>
        <th>Class</th>
    </tr>
    <tr>
        <td>Joyashree</td>
        <td>101</td>
        <td>12th</td>
    </tr>
    <tr>
        <td>Rohini</td>
        <td>102</td>
        <td>12th</td>
    </tr>
    <tr>
        <td>Sumutra</td>
        <td>103</td>
        <td>12th</td>
    </tr>
    </table><br><br>
    <table>
    <tr class="section-header">
        <td colspan="3"> Marks</td>
    </tr>
    <tr>
        <th>Subject</th>
        <th>Max Marks</th>
        <th>Obtained</th>
    </tr>
    <tr>
        <td>Math</td>
        <td>100</td>
        <td>95</td>
    </tr>
    <tr>
        <td>Science</td>
        <td>100</td>
        <td>89</td>
    </tr>
    <tr>
        <td>Education</td>
        <td>100</td>
        <td>85</td>
    </tr>
</table>

</body>
</html>
