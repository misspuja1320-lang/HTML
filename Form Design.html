<html>
<head>
<title> Form Design </title></head>
<style>
    body{
        background:rgb(191, 35, 35);
    }
    form{
        width:400px;
        padding:20px;
        margin:auto;
        background:yellow;
        font-size:20px;
        color:red;
    }
    input[type="text"]{
        width:100%;
        padding:10px;
        font-size:17px;
    }
    input[type="submit"],input[type="reset"]{
        padding:5px;
        font-size:15px;
    }
    textarea{
        
        background: #f2f2f2;;
        width:100%;
        font-size:15px;
        margin:auto;
    }
</style>
<body>
<form>
First Name <br>
<input type="text" name="firstname"><br>
Last Name <br>
<input type="text" name="lastname"><br>
Email-Id
<input type="text" name="emailid"><br>
<textarea name="Messsage" rows="5" cols="30" placeholder="Write queary"></textarea><br><br>
<input type="submit" value="submit">
<input type="reset" value="reset">
</form>
</body>
</html>
