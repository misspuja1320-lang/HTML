<!DOCTYPE html>
<html>
<head>
    <title>Foodie Place</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        h1 {
             text-align:center;
            color:rgb(225, 37, 37);
            padding:5px 10px;
            background-color: yellow;
        }
        nav {
            background-color: lime;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
        }
        nav ul {
            list-style-type: none;
            display: flex;
            gap: 30px;
        }
        nav ul a {
            color: #000;
            font-size: 18px;
            text-decoration: none;
            padding: 10px 15px;
            transition: 0.2s ease-in;
            display: inline-block;
        }
        nav ul a:hover {
            background-color: green;
            color: white;
            border-radius: 5px;
        }
        .items {
            display: grid;
            padding: 30px 20px;
            grid-template-columns: repeat(3, 1fr);
            grid-column-gap: 20px;
            grid-row-gap: 30px;
        }
        .item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            cursor: pointer;
            transition: 0.2s ease;
            border-radius: 8px;
        }
        .item img:hover {
            transform: scale(1.04);
        }
        .item h3 {
            padding: 5px;
            text-align: center;
        }
        .item button {
            padding: 5px 30px;
            background-color: green;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 20px;
            display: block;
            border: none;
            outline: none;
            margin: 0 auto 10px;
            transition: transform 0.2s ease;
        }
        .item button:hover {
            transform: scale(1.04);
        }
    </style>
</head>
<body>
    <h1><b><marquee>Foodie Place</marquee></b></h1>
    <nav>
        <ul>
            <li><a href="home.html">Home</a></li> 
            <li><a href="order.html">Order</a></li>
            <li><a href="near.html">Near</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>
    <section class="items">
        <div class="item">
            <img src="pizza.jpg" alt="Pizza"><h3>Pizza</h3>
            <button>Order</button>
        </div>
        <div class="item">
            <img src="pizza1.jpg" alt="Pizza Veg"><h3>Veg Pizza</h3>
            <button>Order</button>
        </div>
        <div class="item">
            <img src="burger.jpg" alt="Burger"><h3>Burger</h3>
            <button>Order</button>
        </div>
        <div class="item">
            <img src="burger1.jpg" alt="Burger Veg"><h3>Veg Burger</h3>
            <button>Order</button>
        </div>
        <div class="item">
            <img src="pasta.jpg" alt="Pasta"><h3>Pasta</h3>
            <button>Order</button>
        </div>
        <div class="item">
            <img src="pasta1.jpg" alt="Pasta Veg"><h3>Veg Pasta</h3>
            <button>Order</button>
        </div>
        <div class="item">
            <img src="coffee.jpg" alt="Coffee"><h3>Coffee</h3>
            <button>Order</button>
        </div>
        <div class="item">
            <img src="juice.jpg" alt="Juice"><h3>Juice</h3>
            <button>Order</button>
        </div>
        <div class="item">
            <img src="biryani.jpg" alt="Biryani"><h3>Biryani</h3>
            <button>Order</button>
        </div>
    </section>
</body>
</html>
